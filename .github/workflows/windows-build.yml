name: Windows build

on:
  workflow_dispatch:
  push:
    branches: [ main, phase-b-facing ]
    # Only rebuild the exe when code or build files change.  JSON/image-only
    # pushes are handled by the quick "Mod update" workflow instead.
    paths:
      - 'src/**'
      - 'Makefile'
      - 'build-scripts/**'
      - 'lang/**'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            make
            git
            zip
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-pkgconf
            diffutils
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_ttf
            mingw-w64-x86_64-SDL2_mixer
            mingw-w64-x86_64-libjxl
            mingw-w64-x86_64-libwebp
            mingw-w64-x86_64-wavpack
            mingw-w64-x86_64-libvorbis
            mingw-w64-x86_64-libogg
            mingw-w64-x86_64-flac
            mingw-w64-x86_64-opusfile
            mingw-w64-x86_64-mpg123
            mingw-w64-x86_64-libmodplug
            mingw-w64-x86_64-libtiff
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-freetype
            mingw-w64-x86_64-zlib
      - name: Build
        run: |
          set -o pipefail
          export LDFLAGS="$(pkg-config --static --libs SDL2_image SDL2_mixer SDL2_ttf)"
          echo "LDFLAGS=$LDFLAGS"
          make -j4 MSYS2=1 OTHERS=-Wno-error TILES=1 SOUND=1 RELEASE=1 LOCALIZE=0 LINTJSON=0 ASTYLE=0 TESTS=0 CCACHE=1 BACKTRACE=0 PCH=0 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          grep -n -i -B2 -A6 "error\|undefined reference\|\*\*\*" build.log | tail -n 60 | sed 's/^/::error::/' | head -n 60
      - name: Package
        run: |
          mkdir -p out/trilobit
          cp cataclysm-tiles.exe out/trilobit/
          cp -r data gfx out/trilobit/
          ldd cataclysm-tiles.exe | grep -i mingw64 | awk '{print $3}' | xargs -r -I{} cp {} out/trilobit/ || true
          ls -la out/trilobit | head
          cd out && zip -qr ../trilobit-windows.zip trilobit
      - uses: actions/upload-artifact@v4
        with:
          name: trilobit-windows
          path: trilobit-windows.zip
      - name: Publish to the windows-latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create windows-latest trilobit-windows.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Trilobit Windows build (latest)" --notes "Automatic build of commit $GITHUB_SHA.  Unzip, run trilobit/cataclysm-tiles.exe, enable the Trilobit mod when creating a world."
