name: Godot slice (Windows)

# Builds the Godot slice in godot-spike/ into a single Windows .exe, runs the headless test suites first, and publishes the zip to the
# "godot-windows-latest" release.  Cross-exports from Linux, so no Windows runner is needed.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'godot-spike/**'
      - '.github/workflows/godot-windows.yml'

permissions:
  contents: write

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: godot-spike
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and export templates
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-stable-v1

      - name: Install Godot and the export templates
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: .
        run: |
          set -e
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates
          curl -sL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          curl -sL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Put godot on the PATH
        run: |
          ln -sf ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          echo "$HOME/godot-bin" >> "$GITHUB_PATH"

      - name: Run the headless tests
        run: ./run_all.sh

      - name: Import assets
        run: godot --headless --import || true

      - name: Export for Windows
        run: |
          mkdir -p build
          godot --headless --export-release "Windows Desktop" build/Trilobit.exe
          ls -la build

      - name: Package
        run: |
          mkdir -p dist/trilobit-godot
          cp build/Trilobit.exe dist/trilobit-godot/
          cp README.md dist/trilobit-godot/README.txt
          cd dist && zip -qr ../trilobit-godot-windows.zip trilobit-godot

      - uses: actions/upload-artifact@v4
        with:
          name: trilobit-godot-windows
          path: godot-spike/trilobit-godot-windows.zip

      - name: Publish to the godot-windows-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete godot-windows-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create godot-windows-latest trilobit-godot-windows.zip --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "Trilobit Godot slice, Windows (latest)" \
            --notes "Automatic build of commit $GITHUB_SHA.  Unzip and run Trilobit.exe.  Press ? in the game for the keys."
